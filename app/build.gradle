plugins {
    id 'com.android.application'
}

android {
    namespace 'com.devin.cs'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "com.devin.cs"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-fvisibility=hidden', '-fvisibility-inlines-hidden',
                         '-ffunction-sections', '-fdata-sections',
                         '-fno-rtti', '-fno-exceptions',
                         '-Wno-unused-parameter'
                arguments '-DANDROID_STL=c++_static',
                          '-DCMAKE_BUILD_TYPE=Release'
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'NONE'
            }
            packagingOptions {
                doNotStrip '**/lib*_unstripped.so'
            }
        }
        debug {
            // Even in debug, keep some hardening on so we test the real shape.
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    androidResources {
        // Keep shader sources uncompressed in the APK so that
        // AAsset_getBuffer / AAsset_read see real bytes regardless of
        // compression heuristics aapt might apply.
        noCompress 'vert', 'frag', 'glsl', 'spv'
    }

    buildFeatures {
        viewBinding false
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Intentionally minimal: no AppCompat / Material so we don't drag in
    // Kotlin stdlibs we don't need. The activity is a plain android.app.Activity.
}
