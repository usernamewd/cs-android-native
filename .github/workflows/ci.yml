name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.3.11579264
            cmake;3.22.1

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Inspect exported native symbols
        run: |
          set -euxo pipefail
          unzip -p app/build/outputs/apk/release/app-release-unsigned.apk \
            lib/arm64-v8a/libcsnative.so > /tmp/cs.so
          NM=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          $NM -D --defined-only /tmp/cs.so | tee /tmp/exports.txt
          # Hardening invariant: the only exported symbols should be
          # JNI_OnLoad + Java_com_devin_cs_NativeBridge_*. Any new exports
          # likely indicate accidental visibility leak and should be reviewed.
          if grep -Ev "JNI_OnLoad|Java_com_devin_cs_NativeBridge_" /tmp/exports.txt; then
            echo "::error::Unexpected exported native symbol detected"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
